<text x="686" y="154" class="small muted">→ optocoupler #1</text>
<g class="tp"><circle cx="662" cy="187" r="13"/><text x="662" y="192">2</text></g>
<text x="686" y="186" class="bold">+ contacts</text>
<text x="686" y="204" class="small muted">→ optocoupler #2</text>
<g class="tp"><circle cx="662" cy="237" r="13"/><text x="662" y="242">3</text></g>
<text x="686" y="236" class="bold">BAT+ (1.5 V)</text>
<text x="686" y="254" class="small muted">optional: ESP-switched 1.5 V</text>
<g class="tp"><circle cx="662" cy="287" r="13"/><text x="662" y="292">4</text></g>
<text x="686" y="286" class="bold">BAT− (GND)</text>
<text x="686" y="304" class="small muted">optional: common ground</text>
<g class="tp"><circle cx="662" cy="337" r="13"/><text x="662" y="342">5</text></g>
<text x="686" y="336" class="bold">Buzzer</text>
<text x="686" y="354" class="small muted">optional: detect alarm ringing</text>
<text class="bold" x="650" y="404">Original circuit</text>
<text class="small muted" x="650" y="428">Clock IC under the epoxy blob counts</text>
<text class="small muted" x="650" y="446">the 32.768 kHz crystal (2¹⁵ Hz → 1 s)</text>
<text class="small muted" x="650" y="464">and drives the LCD segments through</text>
<text class="small muted" x="650" y="482">the zebra strip. Buttons pull an IC</text>
<text class="small muted" x="650" y="500">input to the common pad. All at 1.5 V.</text>
