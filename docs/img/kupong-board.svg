<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="t d">
<title id="t">KUPONG board anatomy</title>
<desc id="d">Representative top view of the KUPONG clock board: LCD with zebra strip, chip-on-board clock IC, 32.768 kHz crystal, SET and + button contacts, battery pads and piezo buzzer, with five numbered tap points.</desc>
<style>
svg{--bg:#f6f8fa;--surface:#ffffff;--ink:#1f2328;--muted:#59636e;--line:#57606a;
--board:#dcebd6;--boardline:#6d9a62;--copper:#b8732e;--blue:#1f6f9f;--yellow:#9a7300;
--glow:#DFB548;--lcd:#c9d1c1;--lcdink:#1c2418;--cob:#111;--metal:#b9c0c8;--brass:#c9a227}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--surface:#161b22;--ink:#e6edf3;
--muted:#9198a1;--line:#8b949e;--board:#173022;--boardline:#3f7a4f;--copper:#d39a52;
--blue:#7FC4E7;--yellow:#DFB548;--lcd:#2b3328;--lcdink:#dce8d2;--cob:#050505;--metal:#8d959e;--brass:#a8862a}}
.bg{fill:var(--bg)}
.surface{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink);font-size:14px}
.title{font-size:20px;font-weight:700}
.muted{fill:var(--muted)}
.small{font-size:12px}
.bold{font-weight:700}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.blue{fill:var(--blue)}
.wire{stroke:var(--line);stroke-width:2;fill:none}
.trace{stroke:var(--copper);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.copper{fill:var(--copper)}
.board{fill:var(--board);stroke:var(--boardline);stroke-width:2}
.tp circle{fill:var(--glow);stroke:var(--bg);stroke-width:2}
.tp text{font-weight:700;font-size:14px;fill:#1f2328;text-anchor:middle}
.opt{stroke:var(--yellow);stroke-width:2;stroke-dasharray:6 5;fill:none}
.dot{fill:var(--line)}
</style>
<rect class="bg" width="960" height="580" rx="12"/>
<text class="title" x="24" y="38">KUPONG: inside the €1 alarm clock</text>
<text class="muted" x="24" y="60">Representative layout of a typical €1 LCD clock. Check it against your own board before cutting or soldering.</text>
<rect class="board" x="40" y="80" width="560" height="460" rx="18"/>
<rect x="80" y="100" width="480" height="150" rx="8" fill="var(--lcd)" stroke="var(--line)" stroke-dasharray="6 4"/>
<text class="mono" x="320" y="208" text-anchor="middle" style="font-size:96px;font-weight:700;fill:var(--lcdink)">12:00</text>
<text class="mono" x="128" y="232" style="font-size:16px;font-weight:700;fill:var(--lcdink)">AL</text>
<path d="M505 220 q0 -16 10 -16 q10 0 10 16 l4 5 h-28 z M512 228 a3 3 0 0 0 6 0" fill="var(--lcdink)"/>
<text class="small muted" x="92" y="120">LCD glass (front): 4 digits, colon, AL, bell</text>
