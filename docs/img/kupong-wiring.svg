<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" role="img" aria-labelledby="t d">
<title id="t">KUPONG modification wiring</title>
<desc id="d">Schematic: ESP32-C3 GPIO3 and GPIO4 each drive a PC817 optocoupler LED through 1 kilo-ohm; the optocoupler transistors are wired across the KUPONG SET and + button contacts. Optional: GPIO5 feeds a 1.5 V regulator to the battery pads.</desc>
<style>
svg{--bg:#f6f8fa;--surface:#ffffff;--ink:#1f2328;--muted:#59636e;--line:#57606a;
--board:#dcebd6;--boardline:#6d9a62;--copper:#b8732e;--blue:#1f6f9f;--yellow:#9a7300;
--glow:#DFB548;--lcd:#c9d1c1;--lcdink:#1c2418;--cob:#111;--metal:#b9c0c8;--brass:#c9a227}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--surface:#161b22;--ink:#e6edf3;
--muted:#9198a1;--line:#8b949e;--board:#173022;--boardline:#3f7a4f;--copper:#d39a52;
--blue:#7FC4E7;--yellow:#DFB548;--lcd:#2b3328;--lcdink:#dce8d2;--cob:#050505;--metal:#8d959e;--brass:#a8862a}}
.bg{fill:var(--bg)}
.surface{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink);font-size:14px}
.title{font-size:20px;font-weight:700}
.muted{fill:var(--muted)}
.small{font-size:12px}
.bold{font-weight:700}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.blue{fill:var(--blue)}
.wire{stroke:var(--line);stroke-width:2;fill:none}
.trace{stroke:var(--copper);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.copper{fill:var(--copper)}
.board{fill:var(--board);stroke:var(--boardline);stroke-width:2}
.tp circle{fill:var(--glow);stroke:var(--bg);stroke-width:2}
.tp text{font-weight:700;font-size:14px;fill:#1f2328;text-anchor:middle}
.opt{stroke:var(--yellow);stroke-width:2;stroke-dasharray:6 5;fill:none}
.dot{fill:var(--line)}
</style>
<rect class="bg" width="960" height="590" rx="12"/>
<text class="title" x="24" y="38">Modification: the ESP32-C3 presses the buttons through optocouplers</text>
<text class="muted" x="24" y="60">Each PC817 shorts one button contact pair like a finger would. The 3.3 V ESP never touches the 1.5 V clock chip.</text>
<rect class="surface" x="40" y="90" width="200" height="370" rx="10"/>
<text class="bold" x="60" y="118">ESP32-C3</text><text class="small muted" x="60" y="136">SuperMini, USB-C 5 V</text>
<text class="small mono" x="228" y="214" text-anchor="end">GPIO3  SET</text>
<circle class="dot" cx="240" cy="210" r="4"/>
<text class="small mono" x="228" y="334" text-anchor="end">GPIO4  +</text>
<circle class="dot" cx="240" cy="330" r="4"/>
<text class="small mono" x="228" y="404" text-anchor="end">GPIO5  PWR</text>
<circle class="dot" cx="240" cy="400" r="4"/>
<text class="small mono" x="228" y="444" text-anchor="end">GND</text>
<circle class="dot" cx="240" cy="440" r="4"/>
<line class="wire" x1="240" y1="210" x2="290" y2="210"/><polyline class="wire" points="290,210 298,203 306,217 314,203 322,217 330,203 338,217 346,210"/><text class="small muted" x="318" y="198" text-anchor="middle">R1 1 kΩ</text><line class="wire" x1="346" y1="210" x2="420" y2="210"/>
<rect class="surface" x="420" y="190" width="150" height="80" rx="6"/>
<text class="small bold" x="495" y="182" text-anchor="middle">PC817 #1 (SET)</text>
<polyline class="wire" points="420,210 460,210 460,220"/>
<polygon points="450,220 470,220 460,238" fill="var(--glow)" stroke="var(--line)"/>
<line class="wire" x1="450" y1="238" x2="470" y2="238"/>
<polyline class="wire" points="460,238 460,250 420,250"/>
