<rect class="copper" x="740" y="410" width="44" height="24" rx="3"/><rect class="copper" x="852" y="410" width="44" height="24" rx="3"/>
<text class="small bold" x="762" y="426" text-anchor="middle" style="fill:#1f2328">BAT−</text>
<text class="small bold" x="874" y="426" text-anchor="middle" style="fill:#1f2328">BAT+</text>
<g class="tp"><circle cx="722" cy="422" r="13"/><text x="722" y="427">4</text></g>
<g class="tp"><circle cx="914" cy="400" r="13"/><text x="914" y="405">3</text></g>
<polyline class="opt" points="390,440 390,470 762,470 762,434"/>
<polyline class="opt" points="240,400 268,400 268,500 470,500"/>
<rect class="surface" x="470" y="484" width="120" height="34" rx="6" style="stroke:var(--yellow)"/>
<text class="small bold" x="530" y="506" text-anchor="middle">1.5 V LDO</text>
<polyline class="opt" points="590,500 874,500 874,434"/>
<text class="small" x="40" y="548"><tspan class="bold" style="fill:var(--yellow)">- - - Option B</tspan><tspan class="muted"> (no AAA): the ESP powers the clock (e.g. XC6206P152) and can power-cycle it to a known 0:00 state.</tspan></text>
<text class="small muted" x="40" y="568">Option A: keep the AAA; only the two optocouplers are wired, no common ground needed.</text>
</svg>
