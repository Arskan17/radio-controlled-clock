<text class="small muted" x="576" y="206">4</text>
<text class="small muted" x="576" y="262">3</text>
<line class="wire" x1="240" y1="330" x2="290" y2="330"/><polyline class="wire" points="290,330 298,323 306,337 314,323 322,337 330,323 338,337 346,330"/><text class="small muted" x="318" y="318" text-anchor="middle">R2 1 kΩ</text><line class="wire" x1="346" y1="330" x2="420" y2="330"/>
<rect class="surface" x="420" y="310" width="150" height="80" rx="6"/>
<text class="small bold" x="495" y="302" text-anchor="middle">PC817 #2 (+)</text>
<polyline class="wire" points="420,330 460,330 460,340"/>
<polygon points="450,340 470,340 460,358" fill="var(--glow)" stroke="var(--line)"/>
<line class="wire" x1="450" y1="358" x2="470" y2="358"/>
<polyline class="wire" points="460,358 460,370 420,370"/>
<line x1="478" y1="344" x2="502" y2="344" stroke="var(--glow)" stroke-width="2"/><polygon points="502,340 510,344 502,348" fill="var(--glow)"/>
<line x1="478" y1="354" x2="502" y2="354" stroke="var(--glow)" stroke-width="2"/><polygon points="502,350 510,354 502,358" fill="var(--glow)"/>
<line class="wire" x1="520" y1="338" x2="520" y2="362" style="stroke-width:3"/>
<polyline class="wire" points="520,344 540,330 570,330"/>
<polyline class="wire" points="520,356 540,370 570,370"/>
<polygon points="533,361 540,370 529,368" fill="var(--line)"/>
<text class="small muted" x="408" y="326">1</text>
<text class="small muted" x="408" y="382">2</text>
<text class="small muted" x="576" y="326">4</text>
<text class="small muted" x="576" y="382">3</text>
<polyline class="wire" points="420,250 390,250 390,440"/><polyline class="wire" points="420,370 390,370"/>
<circle class="dot" cx="390" cy="370" r="4"/><circle class="dot" cx="390" cy="440" r="4"/>
<line class="wire" x1="240" y1="440" x2="390" y2="440"/>
<rect class="board" x="690" y="90" width="246" height="370" rx="14"/>
<text class="bold" x="710" y="118">KUPONG board</text>
<text class="small muted" x="710" y="136">original electronics stay in place</text>
<circle cx="820" cy="230" r="26" fill="none" stroke="var(--copper)" stroke-width="2.5"/>
<line class="trace" x1="801.3" y1="214.4" x2="801.3" y2="245.6"/>
<line class="trace" x1="838.7" y1="214.4" x2="838.7" y2="245.6"/>
