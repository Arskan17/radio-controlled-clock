<line class="trace" x1="801.3" y1="365.6" x2="830.9" y2="365.6"/>
<text class="bold" x="864" y="355">+</text>
<g class="tp"><circle cx="886" cy="324" r="13"/><text x="886" y="329">2</text></g>
<polyline class="wire" points="570,210 760,210 760,220 801,220"/>
<polyline class="wire" points="570,250 850,250 850,230 839,230"/>
<text class="small muted" x="590" y="204">C → signal pad</text>
<text class="small muted" x="590" y="268">E → common pad</text>
<polyline class="wire" points="570,330 760,330 760,340 801,340"/>
<polyline class="wire" points="570,370 850,370 850,350 839,350"/>
