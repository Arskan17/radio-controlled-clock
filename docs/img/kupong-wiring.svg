<line class="trace" x1="809.1" y1="237.8" x2="838.7" y2="237.8"/>
<line class="trace" x1="801.3" y1="245.6" x2="830.9" y2="245.6"/>
<text class="bold" x="864" y="235">SET</text>
<g class="tp"><circle cx="886" cy="204" r="13"/><text x="886" y="209">1</text></g>
<circle cx="820" cy="350" r="26" fill="none" stroke="var(--copper)" stroke-width="2.5"/>
<line class="trace" x1="801.3" y1="334.4" x2="801.3" y2="365.6"/>
<line class="trace" x1="838.7" y1="334.4" x2="838.7" y2="365.6"/>
